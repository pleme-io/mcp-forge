[package]
name = "mcp-forge"
version = "0.1.5"
edition = "2024"
rust-version = "1.89.0"
description = "Generate Rust MCP servers from OpenAPI specs"
license = "MIT"
repository = "https://github.com/pleme-io/mcp-forge"

[[bin]]
name = "mcp-forge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
heck = "0.5"
serde = { version = "1", features = ["derive"] }
sekkei = "0.1"
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true

[dev-dependencies]
insta = "1.47.2"
pretty_assertions = "1.4.1"
tempfile = "3"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Temporary. client.rs and mcp.rs now emit through the typed AST in
# src/gen/rust_ast.rs and no longer push_str a format!() result. This allow
# survives only for types.rs, scaffold.rs and format.rs; delete it when they
# are converted (pending-format-ban in CLAUDE.md).
format_push_string = "allow"
